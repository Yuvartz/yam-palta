name: Build beach pages (SEO)

# Static, crawlable per-beach pages (docs/<slug>/index.html) + sitemap.xml from the live forecast.
# Every 3 hours; commits only when something changed. Same pattern as the buoy/jellyfish feeds.
on:
  schedule:
    - cron: "20 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beach-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build pages
        run: node scripts/build-beach-pages.mjs
      - name: Commit if changed
        run: |
          git config user.name "yam-plata-bot"
          git config user.email "bot@yamplata.com"
          git add docs/*/index.html docs/sitemap.xml
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "seo: refresh beach pages [skip ci]"
          git pull --rebase origin master
          git push
