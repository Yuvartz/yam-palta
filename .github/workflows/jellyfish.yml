name: Update jellyfish reports

on:
  schedule:
    - cron: "0 * * * *"   # hourly
  workflow_dispatch:        # allow manual run

permissions:
  contents: write

# Shared group with buoy.yml — see the note there about push races.
concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true   # the commit step below pushes; nothing else runs after it
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Fetch & parse jellyfish reports
        run: node scripts/fetch-jellyfish.mjs
      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain docs/data/jellyfish.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/data/jellyfish.json
            git commit -m "data: refresh jellyfish reports [skip ci]"
            git pull --rebase origin master
            git push
          else
            echo "No changes."
          fi
